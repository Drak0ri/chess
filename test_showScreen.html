<!DOCTYPE html>
<html>
<head>
<title>Test showScreen</title>
<style>
  .header, .nav { background: lightblue; padding: 10px; margin: 5px; }
  .screen { display: none; padding: 20px; margin: 10px; background: lightgray; }
  .screen.active { display: block; }
</style>
</head>
<body>
  <header class="header" id="mainHeader">Header Content</header>
  <nav class="nav" id="mainNav">Nav Content</nav>
  
  <div id="loginScreen" class="screen active">Login Screen</div>
  <div id="lobbyScreen" class="screen">Lobby Screen</div>
  <div id="gameScreen" class="screen">Game Screen</div>
  
  <button onclick="showScreen('login')">Show Login</button>
  <button onclick="showScreen('lobby')">Show Lobby</button>
  <button onclick="showScreen('game')">Show Game</button>
  
  <script>
    const $=id=>document.getElementById(id);
    function showScreen(name){
      document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
      $(name+'Screen').classList.add('active');
      
      // Hide header and nav when game screen is active
      const header = document.getElementById('mainHeader');
      const nav = document.getElementById('mainNav');
      if (header && nav) {
        if (name === 'game') {
          header.style.display = 'none';
          nav.style.display = 'none';
        } else {
          header.style.display = '';
          nav.style.display = '';
        }
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IES Chess — Find a Player</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase-init.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Sans+3:wght@300;400;600;700&display=swap');
:root{--bg-dark:#1a1a2e;--bg-card:#16213e;--accent:#e94560;--gold:#f0c040;--text:#eaeaea;--text-dim:#8892a8;--green:#26de81;--orange:#ff9f43;--red:#ff4757}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg-dark);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(233,69,96,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(15,52,96,.3) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(240,192,64,.05) 0%,transparent 50%);pointer-events:none;z-index:0}
h1,h2,h3{font-family:'Playfair Display',serif}
.container{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:20px}
.header{text-align:center;padding:30px 0 20px}
.header img{width:48px;height:48px;object-fit:contain;margin-bottom:8px}
.header h1{font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--gold) 0%,#fff 50%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;text-transform:uppercase}
.header .subtitle{color:var(--text-dim);font-size:.9rem;margin-top:6px;font-weight:300;letter-spacing:3px;text-transform:uppercase}
.nav-links{display:flex;justify-content:center;gap:12px;margin:16px 0 24px;flex-wrap:wrap}
.nav-links a{color:var(--text-dim);text-decoration:none;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);transition:all .2s}
.nav-links a:hover,.nav-links a.active{color:var(--gold);border-color:rgba(240,192,64,.4)}

.current-time{text-align:center;margin-bottom:30px;padding:20px;background:var(--bg-card);border-radius:12px;border:1px solid rgba(255,255,255,.06)}
.current-time .day{font-size:1.2rem;color:var(--gold);font-weight:700;margin-bottom:6px}
.current-time .time{font-family:'Courier New',monospace;font-size:2rem;font-weight:700;color:var(--text)}

.school-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:20px;margin-bottom:30px}
.school-card{background:var(--bg-card);border-radius:14px;padding:24px;border:1px solid rgba(255,255,255,.06);transition:all .2s}
.school-card:hover{border-color:rgba(240,192,64,.3)}
.school-card.available-now{border-color:var(--green);box-shadow:0 0 20px rgba(38,222,129,.2)}

.school-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.school-name{font-size:1.3rem;font-weight:900;color:var(--gold)}
.live-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.live-badge.online{background:rgba(38,222,129,.15);color:var(--green)}
.live-badge.offline{background:rgba(122,133,153,.15);color:var(--text-dim)}
.live-dot{width:8px;height:8px;border-radius:50%;animation:pulse 2s infinite}
.live-badge.online .live-dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.live-badge.offline .live-dot{background:var(--text-dim)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.player-count{font-size:.85rem;color:var(--text-dim);margin-bottom:16px}

.schedule-section{margin-top:16px}
.schedule-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:10px;font-weight:600}
.day-slots{margin-bottom:12px}
.day-name{font-size:.9rem;font-weight:700;color:var(--gold);margin-bottom:6px}
.time-slot{display:inline-block;padding:6px 12px;margin:4px 4px 4px 0;background:rgba(240,192,64,.08);border:1px solid rgba(240,192,64,.2);border-radius:8px;font-size:.85rem;font-family:'Courier New',monospace}
.time-slot.active-now{background:rgba(38,222,129,.15);border-color:var(--green);color:var(--green);font-weight:700}

.no-schedule{color:var(--text-dim);font-style:italic;font-size:.9rem;padding:20px;text-align:center;background:rgba(255,255,255,.02);border-radius:8px;margin-top:12px}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.empty-state h3{font-size:1.2rem;color:var(--text);margin-bottom:6px}

@media(max-width:768px){
  .container{padding:12px}
  .school-grid{grid-template-columns:1fr}
  .header h1{font-size:1.4rem}
  .current-time .time{font-size:1.5rem}
}
</style>
<link rel="stylesheet" href="css/no-scroll.css">
</head>
<body>
<div class="container">
  <header class="header">
    <img src="logo.png" alt="IES">
    <h1>Find a Player</h1>
    <div class="subtitle">See when each school is available to play</div>
  </header>
  
  <nav class="nav-links">
    <a href="index.html">♟ Play</a>
    <a href="chess_news.html">📰 News</a>
    <a href="comp.html">🏆 Competitions</a>
    <a href="bracket.html">🎯 Ladder Matches</a>
    <a href="leaderboard.html">🥇 Leaderboard</a>
    <a href="https://swiftiron.github.io/Chess_Coach/">🎓 Coach</a>
    <a href="findaplayer.html" class="active">🔍 Find a Player</a>
    <a href="admin.html">🔐 Admin</a>
  </nav>

  <div class="current-time">
    <div class="day" id="currentDay">Loading...</div>
    <div class="time" id="currentTime">--:--</div>
  </div>

  <div class="school-grid" id="schoolGrid"></div>
  
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="icon">📅</div>
    <h3>No schedules yet</h3>
    <p>Schools will appear here once they add their play times</p>
  </div>
</div>

<script>
let schools = {};
let playTimes = {};
let lobbyData = {};

const DAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function updateCurrentTime() {
  const now = new Date();
  const dayIndex = now.getDay();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');
  
  document.getElementById('currentDay').textContent = DAY_NAMES[dayIndex];
  document.getElementById('currentTime').textContent = `${hours}:${minutes}:${seconds}`;
  
  return { dayIndex, currentTime: `${hours}:${minutes}` };
}

function isTimeInSlot(currentTime, slotStart, slotEnd) {
  return currentTime >= slotStart && currentTime <= slotEnd;
}

function countPlayersInLobby(schoolId) {
  let count = 0;
  
  // Count players across all lobby paths for this school
  if (lobbyData) {
    Object.values(lobbyData).forEach(lobbyPath => {
      if (lobbyPath && typeof lobbyPath === 'object') {
        Object.values(lobbyPath).forEach(player => {
          if (player && player.schoolId === schoolId) {
            count++;
          }
        });
      }
    });
  }
  
  return count;
}

function renderSchools() {
  const grid = document.getElementById('schoolGrid');
  const empty = document.getElementById('emptyState');
  
  const { dayIndex, currentTime } = updateCurrentTime();
  const currentDayName = DAYS[dayIndex];
  
  const schoolEntries = Object.entries(schools);
  
  if (schoolEntries.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  
  empty.style.display = 'none';
  
  let html = '';
  
  schoolEntries.forEach(([schoolId, school]) => {
    const schoolName = escapeHtml(school.name || schoolId);
    const times = playTimes[schoolId] || [];
    const playerCount = countPlayersInLobby(schoolId);
    
    // Group times by day
    const timesByDay = {};
    times.forEach(slot => {
      const day = slot.day || '';
      if (!timesByDay[day]) timesByDay[day] = [];
      timesByDay[day].push(slot);
    });
    
    // Check if available now
    let availableNow = false;
    const todaySlots = timesByDay[currentDayName] || [];
    todaySlots.forEach(slot => {
      if (isTimeInSlot(currentTime, slot.start, slot.end)) {
        availableNow = true;
      }
    });
    
    const cardClass = availableNow ? 'school-card available-now' : 'school-card';
    const badgeClass = playerCount > 0 ? 'live-badge online' : 'live-badge offline';
    const badgeText = playerCount > 0 ? `${playerCount} Online` : 'Offline';
    
    html += `<div class="${cardClass}">
      <div class="school-header">
        <div class="school-name">${schoolName}</div>
        <div class="${badgeClass}">
          <div class="live-dot"></div>
          ${badgeText}
        </div>
      </div>`;
    
    if (availableNow) {
      html += `<div class="player-count" style="color:var(--green);font-weight:700">✓ Available to play now!</div>`;
    }
    
    if (times.length === 0) {
      html += `<div class="no-schedule">No play times scheduled yet</div>`;
    } else {
      html += `<div class="schedule-section"><div class="schedule-title">Weekly Schedule</div>`;
      
      // Render days in order
      DAYS.forEach((day, idx) => {
        if (idx === 0) return; // Skip Sunday
        const slots = timesByDay[day] || [];
        if (slots.length === 0) return;
        
        html += `<div class="day-slots">
          <div class="day-name">${DAY_NAMES[idx]}</div>`;
        
        slots.forEach(slot => {
          const isActive = day === currentDayName && isTimeInSlot(currentTime, slot.start, slot.end);
          const slotClass = isActive ? 'time-slot active-now' : 'time-slot';
          html += `<span class="${slotClass}">${escapeHtml(slot.start)} - ${escapeHtml(slot.end)}</span>`;
        });
        
        html += `</div>`;
      });
      
      html += `</div>`;
    }
    
    html += `</div>`;
  });
  
  grid.innerHTML = html;
}

// Listen to Firebase data
db.ref('admin/schools').on('value', snap => {
  schools = snap.val() || {};
  renderSchools();
}, err => console.error('findaplayer: schools load failed', err));

// Listen to all play times
db.ref('admin/schools').on('value', snap => {
  const data = snap.val() || {};
  playTimes = {};
  Object.entries(data).forEach(([schoolId, school]) => {
    if (school.playTimes) {
      playTimes[schoolId] = school.playTimes;
    }
  });
  renderSchools();
}, err => console.error('findaplayer: play times load failed', err));

// Listen to lobby for player counts
db.ref('lobby').on('value', snap => {
  lobbyData = snap.val() || {};
  renderSchools();
}, err => console.error('findaplayer: lobby load failed', err));

// Update time every second
setInterval(() => {
  updateCurrentTime();
  renderSchools();
}, 1000);

updateCurrentTime();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Game — Chess</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase-init.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#060d1a;color:#e8ecf4;font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  .header{text-align:center;margin-bottom:18px;}
  .header h1{font-size:1.1rem;letter-spacing:2px;text-transform:uppercase;color:#7a8599;font-family:'Arial',sans-serif;}
  .players{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px;font-size:1.1rem;}
  .player{text-align:center;}
  .player .nickname{font-size:1.4rem;font-weight:700;color:#d4af37;}
  .player .school{font-size:.8rem;color:#7a8599;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
  .player.active .nickname{color:#4a7cff;}
  .vs{color:#7a8599;font-size:1rem;}
  .board-wrap{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
  .board{display:grid;grid-template-columns:repeat(8,1fr);width:min(80vw,560px);height:min(80vw,560px);border:2px solid #2a3a5a;border-radius:4px;overflow:hidden;}
  .sq{display:flex;align-items:center;justify-content:center;position:relative;}
  .sq.light{background:#f0d9b5;}
  .sq.dark{background:#b58863;}
  .sq.last-from,.sq.last-to{outline:3px solid rgba(255,255,100,.5);outline-offset:-3px;}
  .sq img{width:82%;height:82%;object-fit:contain;pointer-events:none;}
  .sidebar{width:220px;display:flex;flex-direction:column;gap:14px;}
  .status-box{background:#0f1e38;border:1px solid #2a3a5a;border-radius:10px;padding:14px;text-align:center;}
  .status-box .turn{font-size:1rem;color:#d4af37;font-weight:700;}
  .status-box .moves{font-size:.82rem;color:#7a8599;margin-top:4px;}
  .move-log{background:#0f1e38;border:1px solid #2a3a5a;border-radius:10px;padding:14px;max-height:420px;overflow-y:auto;}
  .move-log h3{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:#7a8599;margin-bottom:10px;}
  .move-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 8px;font-family:monospace;font-size:.85rem;line-height:1.8;}
  .move-grid .mn{color:#7a8599;text-align:right;}
  .move-grid .mw{color:#e8ecf4;}
  .move-grid .mb{color:#aab4c8;}
  .game-over{background:#1a0a0a;border:2px solid #e74c3c;border-radius:10px;padding:16px;text-align:center;}
  .game-over .result{font-size:1.3rem;color:#d4af37;font-weight:700;}
  .live-badge{display:inline-flex;align-items:center;gap:6px;background:#1a0a0a;border:1px solid #e74c3c;color:#e74c3c;font-size:.75rem;font-family:monospace;letter-spacing:1px;padding:4px 10px;border-radius:20px;margin-bottom:10px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#e74c3c;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  .not-found{text-align:center;color:#7a8599;padding:60px 20px;}
  .not-found h2{font-size:1.4rem;color:#d4af37;margin-bottom:10px;}
</style>
</head>
<body>
<div id="app">
  <div class="not-found"><h2>Loading...</h2><p>Connecting to game</p></div>
</div>
<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const PIECE_IMGS=(()=>{const b='https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett';return{K:b+'/wK.svg',Q:b+'/wQ.svg',R:b+'/wR.svg',B:b+'/wB.svg',N:b+'/wN.svg',P:b+'/wP.svg',k:b+'/bK.svg',q:b+'/bQ.svg',r:b+'/bR.svg',b:b+'/bB.svg',n:b+'/bN.svg',p:b+'/bP.svg'}})();

function stringToBoard(str){return str.split('/').map(r=>r.split(''));}

function renderBoard(board,lastMove){
  const files=['a','b','c','d','e','f','g','h'];
  const ranks=['8','7','6','5','4','3','2','1'];
  let html='<div class="board">';
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const isLight=(r+c)%2===0;
      const piece=board[r][c];
      const isLastFrom=lastMove&&lastMove.from&&lastMove.from[0]===r&&lastMove.from[1]===c;
      const isLastTo=lastMove&&lastMove.to&&lastMove.to[0]===r&&lastMove.to[1]===c;
      let cls='sq '+(isLight?'light':'dark');
      if(isLastFrom)cls+=' last-from';
      if(isLastTo)cls+=' last-to';
      html+=`<div class="${cls}" title="${escapeHtml(files[c]+ranks[r])}">`;
      if(piece&&piece!==' ')html+=`<img src="${escapeHtml(PIECE_IMGS[piece]||'')}" alt="${escapeHtml(piece)}">`;
      html+='</div>';
    }
  }
  html+='</div>';
  return html;
}

function renderMoveLog(moves){
  if(!moves||moves.length===0)return'<div class="move-log"><h3>Moves</h3><div style="color:#7a8599;font-size:.82rem;">Game just started</div></div>';
  let grid='<div class="move-grid">';
  for(let i=0;i<moves.length;i+=2){
    const n=Math.floor(i/2)+1;
    const w=escapeHtml(moves[i]?.notation||'?');
    const b=moves[i+1]?escapeHtml(moves[i+1].notation):'';
    grid+=`<span class="mn">${n}.</span><span class="mw">${w}</span><span class="mb">${b}</span>`;
  }
  grid+='</div>';
  return`<div class="move-log"><h3>Moves</h3>${grid}</div>`;
}

function render(gameData){
  const app=document.getElementById('app');
  if(!gameData||!gameData.host||!gameData.guest){
    app.innerHTML='<div class="not-found"><h2>Game not found</h2><p>This game may have ended or the link is invalid.</p></div>';
    return;
  }
  const state=gameData.state||{};
  const board=state.board?stringToBoard(state.board):null;
  if(!board){app.innerHTML='<div class="not-found"><h2>Waiting for game to start...</h2></div>';return;}

  const moves=Array.isArray(state.moves)?state.moves:[];
  const turn=state.turn||'white';
  const isOver=!!state.gameOver;
  const host=gameData.host,guest=gameData.guest;
  const wPlayer=host,bPlayer=guest;

  let statusHtml='';
  if(isOver&&state.result){
    const r=state.result;
    let msg='';
    if(r.type==='checkmate')msg='Checkmate — '+(r.winner==='white'?escapeHtml(wPlayer.nickname):escapeHtml(bPlayer.nickname))+' wins';
    else if(r.type==='resign')msg=(r.winner==='white'?escapeHtml(wPlayer.nickname):escapeHtml(bPlayer.nickname))+' wins by resignation';
    else if(r.type==='timeout')msg=(r.winner==='white'?escapeHtml(wPlayer.nickname):escapeHtml(bPlayer.nickname))+' wins on time';
    else if(r.type==='abandon')msg=(r.winner==='white'?escapeHtml(wPlayer.nickname):escapeHtml(bPlayer.nickname))+' wins by abandonment';
    else msg='Draw';
    statusHtml=`<div class="game-over"><div class="result">Game Over</div><div style="margin-top:6px;font-size:.9rem;color:#e8ecf4;">${msg}</div></div>`;
  }else{
    const turnName=turn==='white'?escapeHtml(wPlayer.nickname):escapeHtml(bPlayer.nickname);
    statusHtml=`<div class="status-box"><div class="turn">${turnName} to move</div><div class="moves">${moves.length} move${moves.length!==1?'s':''} played</div></div>`;
  }

  app.innerHTML=`
    <div class="header">
      <div class="live-badge"><span class="dot"></span> LIVE</div>
      <h1>Chess — Live Game</h1>
    </div>
    <div class="players">
      <div class="player ${!isOver&&turn==='white'?'active':''}">
        <div class="nickname">♔ ${escapeHtml(wPlayer.nickname||'White')}</div>
        <div class="school">${escapeHtml(wPlayer.school||'')}</div>
      </div>
      <div class="vs">vs</div>
      <div class="player ${!isOver&&turn==='black'?'active':''}">
        <div class="nickname">♚ ${escapeHtml(bPlayer.nickname||'Black')}</div>
        <div class="school">${escapeHtml(bPlayer.school||'')}</div>
      </div>
    </div>
    <div class="board-wrap">
      ${renderBoard(board,state.lastMove)}
      <div class="sidebar">
        ${statusHtml}
        ${renderMoveLog(moves)}
      </div>
    </div>`;

  // Scroll move log to bottom
  const ml=app.querySelector('.move-log');
  if(ml)ml.scrollTop=ml.scrollHeight;
}

// Init
const params=new URLSearchParams(location.search);
const gameId=params.get('game');
if(!gameId){
  document.getElementById('app').innerHTML='<div class="not-found"><h2>No game specified</h2><p>Open this page from the admin panel.</p></div>';
}else{
  db.ref('games/'+gameId).on('value',snap=>{render(snap.val());});
}
</script>
</body>
</html>

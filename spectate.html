<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Game — Chess</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase-init.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--board-size:min(80vw,520px)}
  body{background:#060d1a;color:#e8ecf4;font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0;}
  /* Toolbar */
  #toolbar{width:100%;background:#0a1628;border-bottom:1px solid #1e2e4a;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;}
  #toolbar .live-badge{display:inline-flex;align-items:center;gap:5px;background:#1a0a0a;border:1px solid #e74c3c;color:#e74c3c;font-size:.72rem;font-family:monospace;letter-spacing:1px;padding:3px 9px;border-radius:20px;}
  #toolbar .dot{width:6px;height:6px;border-radius:50%;background:#e74c3c;animation:pulse 1.2s infinite;}
  #toolbar .sep{width:1px;height:20px;background:#1e2e4a;margin:0 2px;}
  #toolbar .tb-label{font-size:.72rem;color:#7a8599;text-transform:uppercase;letter-spacing:1px;}
  .tb-btn{background:#0f1e38;border:1px solid #2a3a5a;color:#aab4c8;font-size:.78rem;padding:5px 11px;border-radius:6px;cursor:pointer;transition:background .15s,color .15s;}
  .tb-btn:hover{background:#1a2d50;color:#e8ecf4;}
  .tb-btn.active{background:#4a7cff;border-color:#4a7cff;color:#fff;}
  /* Main layout */
  #main{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  .players{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:14px;font-size:1.1rem;}
  .player{text-align:center;}
  .player .nickname{font-size:1.3rem;font-weight:700;color:#d4af37;}
  .player .school{font-size:.78rem;color:#7a8599;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
  .player.active .nickname{color:#4a7cff;}
  .vs{color:#7a8599;font-size:.9rem;}
  .board-wrap{display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
  .board{display:grid;grid-template-columns:repeat(8,1fr);width:var(--board-size);height:var(--board-size);border:2px solid #2a3a5a;border-radius:4px;overflow:hidden;}
  /* Large / xl sizes set via classes on <html> */
  html.size-large{--board-size:min(90vw,680px)}
  html.size-xl{--board-size:min(96vmin,900px)}
  .sq{display:flex;align-items:center;justify-content:center;position:relative;}
  .sq.light{background:#f0d9b5;}
  .sq.dark{background:#b58863;}
  .sq.last-from,.sq.last-to{outline:3px solid rgba(255,255,100,.5);outline-offset:-3px;}
  .sq img{width:82%;height:82%;object-fit:contain;pointer-events:none;}
  .sidebar{width:200px;display:flex;flex-direction:column;gap:12px;}
  /* When XL size, collapse sidebar to below */
  html.size-xl .board-wrap{flex-direction:column;align-items:center;}
  html.size-xl .sidebar{width:var(--board-size);flex-direction:row;flex-wrap:wrap;gap:10px;}
  html.size-xl .move-log{flex:1;max-height:140px;}
  .status-box{background:#0f1e38;border:1px solid #2a3a5a;border-radius:10px;padding:12px;text-align:center;}
  .status-box .turn{font-size:.95rem;color:#d4af37;font-weight:700;}
  .status-box .moves{font-size:.78rem;color:#7a8599;margin-top:3px;}
  .move-log{background:#0f1e38;border:1px solid #2a3a5a;border-radius:10px;padding:12px;max-height:400px;overflow-y:auto;}
  .move-log h3{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:#7a8599;margin-bottom:8px;}
  .move-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 8px;font-family:monospace;font-size:.82rem;line-height:1.8;}
  .move-grid .mn{color:#7a8599;text-align:right;}
  .move-grid .mw{color:#e8ecf4;}
  .move-grid .mb{color:#aab4c8;}
  .game-over{background:#1a0a0a;border:2px solid #e74c3c;border-radius:10px;padding:14px;text-align:center;}
  .game-over .result{font-size:1.2rem;color:#d4af37;font-weight:700;}
  .not-found{text-align:center;color:#7a8599;padding:60px 20px;}
  .not-found h2{font-size:1.4rem;color:#d4af37;margin-bottom:10px;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  /* Fullscreen tweaks */
  :fullscreen body,:fullscreen #main{background:#060d1a;}
</style>
</head>
<body>
<div id="toolbar">
  <div class="live-badge"><span class="dot"></span> LIVE</div>
  <div class="sep"></div>
  <span class="tb-label">Board</span>
  <button class="tb-btn active" id="btnNormal" onclick="setSize('normal')">Normal</button>
  <button class="tb-btn" id="btnLarge" onclick="setSize('large')">Large</button>
  <button class="tb-btn" id="btnXL" onclick="setSize('xl')">Full</button>
  <div class="sep"></div>
  <button class="tb-btn" id="btnFlip" onclick="toggleFlip()">⇅ Flip</button>
  <button class="tb-btn" id="btnFs" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</div>
<div id="main">
  <div class="not-found"><h2>Loading...</h2><p>Connecting to game</p></div>
</div>

<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const PIECE_IMGS=(()=>{const b='https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett';return{K:b+'/wK.svg',Q:b+'/wQ.svg',R:b+'/wR.svg',B:b+'/wB.svg',N:b+'/wN.svg',P:b+'/wP.svg',k:b+'/bK.svg',q:b+'/bQ.svg',r:b+'/bR.svg',b:b+'/bB.svg',n:b+'/bN.svg',p:b+'/bP.svg'}})();

let isFlipped=false;

function setSize(size){
  document.documentElement.classList.remove('size-large','size-xl');
  if(size==='large')document.documentElement.classList.add('size-large');
  if(size==='xl')document.documentElement.classList.add('size-xl');
  ['btnNormal','btnLarge','btnXL'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(size==='normal'?'btnNormal':size==='large'?'btnLarge':'btnXL').classList.add('active');
}

function toggleFlip(){
  isFlipped=!isFlipped;
  document.getElementById('btnFlip').classList.toggle('active',isFlipped);
  if(lastGameData)render(lastGameData);
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
    document.getElementById('btnFs').classList.add('active');
  }else{
    document.exitFullscreen();
    document.getElementById('btnFs').classList.remove('active');
  }
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement)document.getElementById('btnFs').classList.remove('active');
});

function stringToBoard(str){return str.split('/').map(r=>r.split(''));}

function renderBoardHtml(board,lastMove){
  const files=['a','b','c','d','e','f','g','h'];
  const ranks=['8','7','6','5','4','3','2','1'];
  let html='<div class="board">';
  for(let vr=0;vr<8;vr++){
    for(let vc=0;vc<8;vc++){
      const r=isFlipped?(7-vr):vr;
      const c=isFlipped?(7-vc):vc;
      const isLight=(r+c)%2===0;
      const piece=board[r][c];
      const isLastFrom=lastMove&&lastMove.from&&lastMove.from[0]===r&&lastMove.from[1]===c;
      const isLastTo=lastMove&&lastMove.to&&lastMove.to[0]===r&&lastMove.to[1]===c;
      let cls='sq '+(isLight?'light':'dark');
      if(isLastFrom)cls+=' last-from';
      if(isLastTo)cls+=' last-to';
      html+=`<div class="${cls}" title="${escapeHtml(files[c]+ranks[r])}">`;
      if(piece&&piece!==' ')html+=`<img src="${escapeHtml(PIECE_IMGS[piece]||'')}" alt="${escapeHtml(piece)}">`;
      html+='</div>';
    }
  }
  html+='</div>';
  return html;
}

function renderMoveLog(moves){
  const inner=(!moves||moves.length===0)
    ?'<div style="color:#7a8599;font-size:.82rem;">Game just started</div>'
    :(()=>{
        let g='<div class="move-grid">';
        for(let i=0;i<moves.length;i+=2){
          const n=Math.floor(i/2)+1;
          const w=escapeHtml(moves[i]?.notation||'?');
          const b=moves[i+1]?escapeHtml(moves[i+1].notation):'';
          g+=`<span class="mn">${n}.</span><span class="mw">${w}</span><span class="mb">${b}</span>`;
        }
        return g+'</div>';
      })();
  return`<div class="move-log"><h3>Moves</h3>${inner}</div>`;
}

let lastGameData=null;

function render(gameData){
  lastGameData=gameData;
  const app=document.getElementById('main');
  if(!gameData||!gameData.host||!gameData.guest){
    app.innerHTML='<div class="not-found"><h2>Game not found</h2><p>This game may have ended or the link is invalid.</p></div>';
    return;
  }
  const state=gameData.state||{};
  const board=state.board?stringToBoard(state.board):null;
  if(!board){app.innerHTML='<div class="not-found"><h2>Waiting for first move...</h2><p>Board will appear once play begins.</p></div>';return;}

  const moves=Array.isArray(state.moves)?state.moves:[];
  const turn=state.turn||'white';
  const isOver=!!state.gameOver;
  const wPlayer=gameData.host,bPlayer=gameData.guest;

  let statusHtml;
  if(isOver&&state.result){
    const r=state.result;
    let msg;
    if(r.type==='checkmate')msg='Checkmate — '+(r.winner==='white'?escapeHtml(wPlayer.nickname):escapeHtml(bPlayer.nickname))+' wins';
    else if(r.type==='resign')msg=(r.winner==='white'?escapeHtml(wPlayer.nickname):escapeHtml(bPlayer.nickname))+' wins by resignation';
    else if(r.type==='timeout')msg=(r.winner==='white'?escapeHtml(wPlayer.nickname):escapeHtml(bPlayer.nickname))+' wins on time';
    else if(r.type==='abandon')msg=(r.winner==='white'?escapeHtml(wPlayer.nickname):escapeHtml(bPlayer.nickname))+' wins by abandonment';
    else msg='Draw ('+escapeHtml(r.type)+')';
    statusHtml=`<div class="game-over"><div class="result">Game Over</div><div style="margin-top:6px;font-size:.88rem;color:#e8ecf4;">${msg}</div></div>`;
  }else{
    const turnName=turn==='white'?escapeHtml(wPlayer.nickname):escapeHtml(bPlayer.nickname);
    statusHtml=`<div class="status-box"><div class="turn">${turnName} to move</div><div class="moves">${moves.length} move${moves.length!==1?'s':''}</div></div>`;
  }

  const wActive=!isOver&&turn==='white';
  const bActive=!isOver&&turn==='black';

  app.innerHTML=`
    <div class="players">
      <div class="player ${wActive?'active':''}">
        <div class="nickname">♔ ${escapeHtml(wPlayer.nickname||'White')}</div>
        <div class="school">${escapeHtml(wPlayer.school||'')}</div>
      </div>
      <div class="vs">vs</div>
      <div class="player ${bActive?'active':''}">
        <div class="nickname">♚ ${escapeHtml(bPlayer.nickname||'Black')}</div>
        <div class="school">${escapeHtml(bPlayer.school||'')}</div>
      </div>
    </div>
    <div class="board-wrap">
      ${renderBoardHtml(board,state.lastMove)}
      <div class="sidebar">
        ${statusHtml}
        ${renderMoveLog(moves)}
      </div>
    </div>`;

  const ml=app.querySelector('.move-log');
  if(ml)ml.scrollTop=ml.scrollHeight;
}

const params=new URLSearchParams(location.search);
const gameId=params.get('game');
if(!gameId){
  document.getElementById('main').innerHTML='<div class="not-found"><h2>No game specified</h2><p>Open this page from the admin panel.</p></div>';
}else{
  db.ref('games/'+gameId).on('value',snap=>{render(snap.val());});
}
</script>
</body>
</html>

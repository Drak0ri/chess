<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Game - Chess Portal</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">♟️ Chess Portal</div>
    <div class="nav-user">
      <span id="userName"></span>
      <button id="backBtn" class="btn btn-small">Back to Dashboard</button>
    </div>
  </nav>

  <div class="game-container">
    <div class="game-sidebar">
      <div class="game-info">
        <h3 id="gameTitle">Chess Game</h3>
        <div class="game-status" id="gameStatus">Loading...</div>
      </div>

      <div class="player-info">
        <div class="player-card" id="opponentCard">
          <div class="player-name" id="opponentName">Opponent</div>
          <div class="player-elo" id="opponentElo">ELO: 1200</div>
          <div class="player-time" id="opponentTime">10:00</div>
        </div>

        <div class="player-card my-player">
          <div class="player-name" id="myName">You</div>
          <div class="player-elo" id="myElo">ELO: 1200</div>
          <div class="player-time" id="myTime">10:00</div>
        </div>
      </div>

      <div class="game-controls">
        <button id="resignBtn" class="btn btn-danger">Resign</button>
        <button id="offerDrawBtn" class="btn btn-secondary">Offer Draw</button>
      </div>

      <div class="move-history">
        <h4>Move History</h4>
        <div id="moveList" class="move-list"></div>
      </div>
    </div>

    <div class="game-board">
      <div id="chessboard"></div>
      <div id="gameResult" class="game-result"></div>
    </div>
  </div>

  <!-- Draw Offer Modal -->
  <div id="drawOfferModal" class="modal">
    <div class="modal-content">
      <h3>Draw Offer</h3>
      <p>Your opponent has offered a draw. Do you accept?</p>
      <div class="modal-actions">
        <button id="acceptDrawBtn" class="btn btn-primary">Accept</button>
        <button id="declineDrawBtn" class="btn btn-secondary">Decline</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="/js/chess-game.js"></script>
</body>
</html>

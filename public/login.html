<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Tournament Portal - Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-box">
      <h1>♟️ Chess Tournament Portal</h1>
      <p class="subtitle">School Chess Competitions</p>

      <div id="message" class="message"></div>

      <!-- Login Form -->
      <form id="loginForm" class="form-container">
        <h2>Login</h2>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="email" required
                 placeholder="firstname.lastname.student.school@engelska.se">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
        <p class="form-switch">Don't have an account? <a href="#" id="showRegister">Register</a></p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="form-container" style="display: none;">
        <h2>Register</h2>
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" name="email" required
                 placeholder="firstname.lastname.student.school@engelska.se">
          <small>Format: firstname.lastname.student.school@engelska.se</small>
        </div>
        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" name="password" required minlength="6">
          <small>Minimum 6 characters</small>
        </div>
        <div class="form-group">
          <label for="yearGroup">Year Group</label>
          <select id="yearGroup" name="yearGroup" required>
            <option value="">Select year group</option>
            <option value="4">Year 4</option>
            <option value="5">Year 5</option>
            <option value="6">Year 6</option>
            <option value="7">Year 7</option>
            <option value="8">Year 8</option>
            <option value="9">Year 9</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
        <p class="form-switch">Already have an account? <a href="#" id="showLogin">Login</a></p>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>

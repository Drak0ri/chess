<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IES Chess — Knockout Bracket</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase-init.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Sans+3:wght@300;400;600;700&display=swap');

:root {
  --bg-dark: #1a1a2e;
  --bg-card: #16213e;
  --bg-surface: #1e2a45;
  --border: rgba(255,255,255,.06);
  --accent: #e94560;
  --accent-glow: #e9456088;
  --gold: #f0c040;
  --gold-dim: rgba(240, 192, 64, 0.2);
  --silver: #b0bec5;
  --silver-dim: rgba(176, 190, 197, 0.2);
  --bronze: #cd7f32;
  --green: #26de81;
  --green-dim: rgba(38, 222, 129, 0.15);
  --orange: #ff9f43;
  --red: #ff4757;
  --text: #eaeaea;
  --text-dim: #8892a8;
  --text-muted: #5a6a80;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Source Sans 3', sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(233,69,96,.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(15,52,96,.3) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(240,192,64,.05) 0%, transparent 50%);
  pointer-events: none;
}

h1, h2, h3 { font-family: 'Playfair Display', serif; }

.page {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px 24px 40px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  text-align: center;
  padding: 30px 0 0;
}

.header img { width: 48px; height: 48px; object-fit: contain; margin-bottom: 8px; }

.header h1 {
  font-size: 2rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--gold) 0%, #fff 50%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.header .subtitle {
  font-size: 0.9rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-top: 6px;
  font-weight: 300;
}

.nav-links { display: flex; justify-content: center; gap: 12px; margin: 16px 0 16px; flex-wrap: wrap; }
.nav-links a { color: var(--text-dim); text-decoration: none; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1); transition: all .2s; }
.nav-links a:hover, .nav-links a.active { color: var(--gold); border-color: rgba(240,192,64,.4); }

.bracket-meta {
  text-align: center;
  margin-bottom: 28px;
}

.bracket-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 6px;
}

.bracket-subtitle {
  font-size: 0.85rem;
  color: var(--text-dim);
}

/* Empty / loading states */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}
.empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
.empty-state h2 { font-size: 1.4rem; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 0.9rem; }

/* Bracket layout */
.bracket-scroll {
  overflow-x: auto;
  padding-bottom: 20px;
}

.bracket-container {
  display: flex;
  align-items: stretch;
  gap: 0;
  min-width: max-content;
  padding: 20px 0;
}

/* Round column */
.round-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 180px;
}

.round-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  margin-bottom: 16px;
  text-align: center;
  padding: 5px 12px;
  border-radius: 20px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
}

.round-label.final-label {
  color: var(--gold);
  background: rgba(240,192,64,.08);
  border-color: rgba(240,192,64,.3);
}

.matches-col {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  flex: 1;
  gap: 0;
  width: 100%;
}

/* Connector lines between rounds */
.connector-col {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  width: 40px;
  flex-shrink: 0;
}

.connector-pair {
  display: flex;
  flex-direction: column;
  flex: 1;
  position: relative;
}

.connector-pair::before {
  content: '';
  position: absolute;
  right: 0;
  top: 25%;
  bottom: 25%;
  width: 2px;
  background: var(--border);
}

.connector-pair::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  width: 40px;
  height: 2px;
  background: var(--border);
  transform: translateX(0);
}

/* Match card */
.match-wrapper {
  display: flex;
  flex-direction: column;
  flex: 1;
  justify-content: center;
  padding: 6px 0;
}

.match-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  width: 164px;
  margin: 0 8px;
  transition: border-color .2s;
}

.match-card:hover {
  border-color: rgba(255,255,255,.15);
}

.team-slot {
  display: flex;
  align-items: center;
  padding: 9px 12px;
  gap: 8px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-dim);
  transition: all .2s;
  min-height: 38px;
  position: relative;
}

.team-slot:first-child {
  border-bottom: 1px solid var(--border);
}

.team-slot.winner {
  color: var(--text);
  background: linear-gradient(90deg, rgba(240,192,64,.12) 0%, transparent 100%);
}

.team-slot.winner::after {
  content: '✓';
  position: absolute;
  right: 10px;
  font-size: 0.75rem;
  color: var(--gold);
  font-weight: 900;
}

.team-slot.tbd {
  color: var(--text-muted);
  font-style: italic;
  font-weight: 400;
}

.team-seed {
  font-size: 0.68rem;
  color: var(--text-muted);
  font-weight: 400;
  min-width: 16px;
  text-align: center;
  font-style: normal;
}

.team-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Final winner display */
.winner-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 180px;
  padding: 0 8px;
}

.winner-trophy {
  text-align: center;
}

.winner-trophy .trophy-icon {
  font-size: 2.8rem;
  display: block;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 16px rgba(240,192,64,.6));
  animation: trophyPulse 3s ease-in-out infinite;
}

@keyframes trophyPulse {
  0%, 100% { filter: drop-shadow(0 0 12px rgba(240,192,64,.5)); transform: scale(1); }
  50% { filter: drop-shadow(0 0 24px rgba(240,192,64,.9)); transform: scale(1.05); }
}

.winner-trophy .winner-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 8px;
}

.winner-trophy .winner-name {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--gold);
  background: rgba(240,192,64,.1);
  border: 1px solid rgba(240,192,64,.35);
  border-radius: 10px;
  padding: 10px 16px;
  min-width: 140px;
  text-align: center;
}

.winner-trophy .winner-name.tbd {
  color: var(--text-muted);
  font-style: italic;
  font-size: 0.9rem;
  border-color: var(--border);
  background: transparent;
}

.footer {
  text-align: center;
  padding: 24px 0 0;
  font-size: 0.75rem;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  margin-top: auto;
}

@media (max-width: 600px) {
  .page { padding: 16px 12px 32px; }
  .header h1 { font-size: 1.5rem; }
  .round-col { min-width: 150px; }
  .match-card { width: 140px; }
}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <img src="logo.png" alt="IES Logo">
    <h1>IES Chess Club</h1>
    <div class="subtitle">Knockout Bracket</div>
  </div>

  <nav class="nav-links">
    <a href="index.html">♟ Play</a>
    <a href="leaderboard.html">🏆 Leaderboard</a>
    <a href="leaderboard.html" class="active">🥊 Knockout Bracket</a>
    <a href="comp.html">🎯 Competitions</a>
    <a href="chess_news.html">📰 News</a>
    <a href="findaplayer.html">🔍 Find a Player</a>
    <a href="admin.html">🔐 Admin</a>
  </nav>

  <div class="bracket-meta">
    <div class="bracket-title" id="bracketTitle">Tournament Bracket</div>
    <div class="bracket-subtitle" id="bracketSubtitle">Loading…</div>
  </div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="icon">🥊</div>
    <h2>No bracket yet</h2>
    <p>The tournament bracket will appear here once it has been set up by an admin.</p>
  </div>

  <div class="bracket-scroll">
    <div class="bracket-container" id="bracketContainer"></div>
  </div>

  <div class="footer">
    IES Chess Club Portal &middot; Knockout Tournament Bracket
  </div>
</div>

<script>
const db = firebase.database();

function buildBracket(bracketData) {
  const container = document.getElementById('bracketContainer');
  container.innerHTML = '';

  const rounds = bracketData.rounds || [];
  if (!rounds.length) {
    document.getElementById('emptyState').style.display = 'block';
    return;
  }

  document.getElementById('emptyState').style.display = 'none';

  const title = bracketData.name || 'Tournament Bracket';
  const totalTeams = rounds[0] ? rounds[0].matches.reduce((n, m) => n + (m.team1 ? 1 : 0) + (m.team2 ? 1 : 0), 0) : 0;
  document.getElementById('bracketTitle').textContent = title;
  document.getElementById('bracketSubtitle').textContent =
    totalTeams > 0 ? `${totalTeams} teams · ${rounds.length} rounds` : '';

  rounds.forEach((round, rIdx) => {
    // Round column
    const roundCol = document.createElement('div');
    roundCol.className = 'round-col';

    const label = document.createElement('div');
    const isFinalRound = rIdx === rounds.length - 1;
    label.className = 'round-label' + (isFinalRound ? ' final-label' : '');
    label.textContent = round.name || getRoundName(rIdx, rounds.length);
    roundCol.appendChild(label);

    const matchesCol = document.createElement('div');
    matchesCol.className = 'matches-col';

    (round.matches || []).forEach(match => {
      const wrapper = document.createElement('div');
      wrapper.className = 'match-wrapper';

      const card = document.createElement('div');
      card.className = 'match-card';

      [1, 2].forEach(side => {
        const teamName = match['team' + side] || null;
        const isWinner = match.winner && match.winner === teamName && teamName;
        const isTBD = !teamName;

        const slot = document.createElement('div');
        slot.className = 'team-slot' + (isWinner ? ' winner' : '') + (isTBD ? ' tbd' : '');

        const seed = document.createElement('span');
        seed.className = 'team-seed';
        seed.textContent = match['seed' + side] || '';
        slot.appendChild(seed);

        const name = document.createElement('span');
        name.className = 'team-name';
        name.textContent = teamName || 'TBD';
        slot.appendChild(name);

        card.appendChild(slot);
      });

      wrapper.appendChild(card);
      matchesCol.appendChild(wrapper);
    });

    roundCol.appendChild(matchesCol);
    container.appendChild(roundCol);

    // Connector between rounds (not after last round)
    if (rIdx < rounds.length - 1) {
      const connCol = document.createElement('div');
      connCol.className = 'connector-col';
      const numMatches = round.matches.length;
      for (let i = 0; i < numMatches; i += 2) {
        const pair = document.createElement('div');
        pair.className = 'connector-pair';
        pair.style.flex = '2';
        connCol.appendChild(pair);
      }
      container.appendChild(connCol);
    }
  });

  // Final winner column
  const lastRound = rounds[rounds.length - 1];
  const finalMatch = lastRound && lastRound.matches && lastRound.matches[0];
  const champion = finalMatch && finalMatch.winner ? finalMatch.winner : null;

  const winnerCol = document.createElement('div');
  winnerCol.className = 'winner-col';

  const trophy = document.createElement('div');
  trophy.className = 'winner-trophy';
  trophy.innerHTML = `
    <span class="trophy-icon">🏆</span>
    <div class="winner-label">Champion</div>
    <div class="winner-name${champion ? '' : ' tbd'}">${champion || 'TBD'}</div>
  `;
  winnerCol.appendChild(trophy);
  container.appendChild(winnerCol);
}

function getRoundName(idx, total) {
  const fromEnd = total - 1 - idx;
  if (fromEnd === 0) return 'Final';
  if (fromEnd === 1) return 'Semi-Final';
  if (fromEnd === 2) return 'Quarter-Final';
  return 'Round ' + (idx + 1);
}

// Load bracket from Firebase
db.ref('admin/knockoutBracket').on('value', snap => {
  const data = snap.val();
  if (!data || !data.rounds || data.rounds.length === 0) {
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('bracketContainer').innerHTML = '';
    document.getElementById('bracketSubtitle').textContent = 'No bracket configured yet';
    return;
  }
  buildBracket(data);
});
</script>
</body>
</html>

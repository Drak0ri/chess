<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IES Chess — Ladder Matches</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase-init.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Sans+3:wght@300;400;600;700&display=swap');

:root {
  --bg-dark: #1a1a2e;
  --bg-card: #16213e;
  --bg-surface: #1e2a45;
  --border: rgba(255,255,255,.06);
  --accent: #e94560;
  --gold: #f0c040;
  --gold-dim: rgba(240, 192, 64, 0.2);
  --green: #26de81;
  --orange: #ff9f43;
  --red: #ff4757;
  --text: #eaeaea;
  --text-dim: #8892a8;
  --text-muted: #5a6a80;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Source Sans 3', sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(233,69,96,.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(15,52,96,.3) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(240,192,64,.05) 0%, transparent 50%);
  pointer-events: none;
}

h1, h2, h3 { font-family: 'Playfair Display', serif; }

.page {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 24px 40px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header { text-align: center; padding: 30px 0 0; }
.header img { width: 48px; height: 48px; object-fit: contain; margin-bottom: 8px; }
.header h1 {
  font-size: 2rem; font-weight: 900;
  background: linear-gradient(135deg, var(--gold) 0%, #fff 50%, var(--gold) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 2px; text-transform: uppercase;
}
.header .subtitle { font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 3px; margin-top: 6px; font-weight: 300; }

.nav-links { display: flex; justify-content: center; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
.nav-links a { color: var(--text-dim); text-decoration: none; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1); transition: all .2s; }
.nav-links a:hover, .nav-links a.active { color: var(--gold); border-color: rgba(240,192,64,.4); }

.footer { text-align: center; padding: 24px 0 0; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: auto; }

@media (max-width: 600px) {
  .page { padding: 16px 12px 32px; }
  .header h1 { font-size: 1.5rem; }
}

/* Champion Banner */
.champion-banner {
  background: linear-gradient(135deg, rgba(240,192,64,.15) 0%, rgba(240,192,64,.05) 100%);
  border: 1px solid rgba(240,192,64,.4);
  border-radius: 14px;
  padding: 28px 24px;
  text-align: center;
  margin-bottom: 32px;
}
.champion-banner .label { font-size: .72rem; text-transform: uppercase; letter-spacing: 3px; color: var(--text-muted); margin-bottom: 8px; }
.champion-banner .name { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--gold); }

/* Round section */
.round-section { margin-bottom: 32px; }
.round-header {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  margin-bottom: 14px;
}
.round-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--text); }
.round-countdown { font-size: .82rem; font-weight: 700; color: var(--orange); }
.round-countdown.ended { color: var(--text-muted); }

/* Pairing grid */
.pub-ld-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

.pub-ld-card {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 10px;
  padding: 14px;
  transition: border-color .2s;
}
.pub-ld-card.done { border-color: rgba(240,192,64,.35); }
.pub-ld-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.pub-ld-school { font-size: .88rem; font-weight: 600; color: var(--text); }
.pub-ld-winner-name { color: var(--gold); }
.pub-ld-score { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 900; color: var(--text-dim); }
.pub-ld-score.lead { color: var(--gold); }
.pub-ld-bar { height: 5px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; margin-bottom: 3px; }
.pub-ld-fill { height: 100%; border-radius: 4px; transition: width .4s ease; }
.pub-ld-mid { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; margin: 3px 0; border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06); font-size: .68rem; color: var(--text-dim); }
.pub-ld-winner-badge { background: rgba(240,192,64,.15); color: var(--gold); border: 1px solid rgba(240,192,64,.3); border-radius: 20px; padding: 2px 8px; font-size: .68rem; font-weight: 700; }

/* History rows */
.ko-history-section { margin-top: 32px; }
.ko-history-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--text-dim); margin-bottom: 12px; }
.ko-history-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.ko-history-row:last-child { border-bottom: none; }
.ko-round-badge { background: rgba(74,124,255,.15); color: #7eaaff; border: 1px solid rgba(74,124,255,.3); border-radius: 20px; padding: 2px 10px; font-size: .72rem; font-weight: 700; min-width: 76px; text-align: center; }

/* Idle state */
.ko-idle { text-align: center; padding: 48px 24px; color: var(--text-muted); font-size: .95rem; }
.ko-idle .icon { font-size: 2.5rem; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <img src="logo.png" alt="IES Logo">
    <h1>IES Chess Club</h1>
    <div class="subtitle">Ladder Matches</div>
  </div>

  <nav class="nav-links">
    <a href="index.html">♟ Play</a>
    <a href="chess_news.html">📰 News</a>
    <a href="comp.html">🏆 Competitions</a>
    <a href="bracket.html" class="active">🎯 Ladder Matches</a>
    <a href="leaderboard.html">🥇 Leaderboard</a>
    <a href="https://swiftiron.github.io/Chess_Coach/">🎓 Coach</a>
    <a href="findaplayer.html">🔍 Find a Player</a>
    <a href="admin.html">🔐 Admin</a>
  </nav>

  <div id="ladderSection" style="padding: 0 8px;"></div>
  <div id="customLadderSection" style="padding: 0 8px; margin-top: 24px;"></div>

  <div class="footer">
    IES Chess Club Portal &middot; Ladder Matches
  </div>
</div>

<script>
const db = firebase.database();
let allMatches = {};
let ladderState = null;
let customLadderState = null;
let countdownInterval = null;

db.ref('matches').on('value', snap => {
  allMatches = snap.val() || {};
  if (ladderState) buildLadder(ladderState);
  if (customLadderState) buildCustomLadder(customLadderState);
});

db.ref('admin/ladder/knockout').on('value', snap => {
  ladderState = snap.val() || {};
  buildLadder(ladderState);
});

db.ref('admin/ladder/custom').on('value', snap => {
  customLadderState = snap.val() || {};
  buildCustomLadder(customLadderState);
});

function calcLadderScore(pairing) {
  if (!pairing || pairing.bye || !pairing.startTime || !pairing.school1 || !pairing.school2) return { s1: 0, s2: 0 };
  let s1 = 0, s2 = 0;
  const t1 = pairing.school1, t2 = pairing.school2;
  const endCutoff = pairing.endTime || Infinity;
  Object.values(allMatches).forEach(m => {
    if (m.scoreRemoved || (m.suspicious && !m.integrityApproved) || !m.result || !m.createdAt) return;
    if (m.createdAt < pairing.startTime) return;
    if (m.createdAt > endCutoff) return;
    const isT1w = (m.whiteSchool === t1 && m.blackSchool === t2);
    const isT2w = (m.whiteSchool === t2 && m.blackSchool === t1);
    if (!isT1w && !isT2w) return;
    if (m.result === 'draw') return;
    if (isT1w && m.result === 'white') s1++;
    else if (isT1w && m.result === 'black') s2++;
    else if (isT2w && m.result === 'white') s2++;
    else if (isT2w && m.result === 'black') s1++;
  });
  return { s1, s2 };
}

function buildPubLadderCard(p, winsTarget) {
  const t    = winsTarget || 10;
  const card = document.createElement('div');

  if (p.bye) {
    card.className = 'pub-ld-card done';
    card.innerHTML = `
      <div class="pub-ld-row">
        <span class="pub-ld-school pub-ld-winner-name">${p.school1}</span>
        <span class="pub-ld-winner-badge">BYE — Auto-Win</span>
      </div>`;
    return card;
  }

  const sc     = calcLadderScore(p);
  let { s1, s2 } = sc;
  let winner   = p.winner || null;
  if (!winner) {
    if (s1 >= t) winner = p.school1;
    else if (s2 >= t) winner = p.school2;
  }
  const done   = !!winner;
  card.className = 'pub-ld-card' + (done ? ' done' : '');

  const w1pct  = Math.min(100, Math.round((s1 / t) * 100));
  const w2pct  = Math.min(100, Math.round((s2 / t) * 100));
  const s1Lead = s1 > s2, s2Lead = s2 > s1;
  const w1 = winner === p.school1, w2 = winner === p.school2;

  card.innerHTML = `
    <div class="pub-ld-row">
      <span class="pub-ld-school ${w1 ? 'pub-ld-winner-name' : ''}">${p.school1}</span>
      <span class="pub-ld-score ${s1Lead ? 'lead' : ''}">${s1}</span>
    </div>
    <div class="pub-ld-bar">
      <div class="pub-ld-fill" style="width:${w1pct}%;background:${w1 ? 'var(--gold)' : '#4a7cff'};"></div>
    </div>
    <div class="pub-ld-mid">
      <span>First to ${t} wins</span>
      ${done
        ? `<span class="pub-ld-winner-badge">🏆 ${winner} advances</span>`
        : `<span>${s1} – ${s2}</span>`}
    </div>
    <div class="pub-ld-bar" style="transform:scaleX(-1);">
      <div class="pub-ld-fill" style="width:${w2pct}%;background:${w2 ? 'var(--gold)' : 'var(--orange)'};"></div>
    </div>
    <div class="pub-ld-row" style="margin-top:3px;">
      <span class="pub-ld-school ${w2 ? 'pub-ld-winner-name' : ''}">${p.school2}</span>
      <span class="pub-ld-score ${s2Lead ? 'lead' : ''}">${s2}</span>
    </div>`;
  return card;
}

function formatCountdown(endTime) {
  const rem = endTime - Date.now();
  if (rem <= 0) return null;
  const d = Math.floor(rem / 86400000);
  const h = Math.floor((rem % 86400000) / 3600000);
  const m = Math.floor((rem % 3600000) / 60000);
  if (d > 0) return `⏱ ${d}d ${h}h remaining`;
  if (h > 0) return `⏱ ${h}h ${m}m remaining`;
  return `⏱ ${m}m remaining`;
}

function buildLadder(ko) {
  const section = document.getElementById('ladderSection');
  if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

  const status = ko.status || 'idle';

  if (status === 'idle') {
    section.innerHTML = `
      <div class="ko-idle">
        <div class="icon">🎯</div>
        <div>No ladder tournament is currently running.</div>
      </div>`;
    return;
  }

  if (status === 'scheduled') {
    const dt = ko.scheduledStart ? new Date(ko.scheduledStart).toLocaleString() : '—';
    section.innerHTML = `
      <div class="ko-idle">
        <div class="icon">📅</div>
        <div style="font-weight:700;margin-bottom:6px;">Ladder Starting Soon</div>
        <div style="font-size:.88rem;color:var(--text-dim);">The ladder tournament is scheduled to begin on<br><strong>${dt}</strong></div>
      </div>`;
    return;
  }

  let html = '';

  // Champion banner
  if (status === 'completed' && ko.champion) {
    html += `
      <div class="champion-banner">
        <div class="label">🏆 Knockout Champion</div>
        <div class="name">${ko.champion}</div>
      </div>`;
  }

  const rounds         = ko.rounds || [];
  const currentRoundIdx = ko.currentRoundIdx || 0;
  const winsTarget     = ko.winsTarget || 10;

  // Current active or paused round
  if ((status === 'active' || status === 'paused') && rounds[currentRoundIdx]) {
    const round    = rounds[currentRoundIdx];
    const pairings = round.pairings || [];
    const nonBye   = pairings.filter(p => !p.bye).length;

    const pauseBanner = status === 'paused'
      ? `<div style="background:rgba(255,160,50,.12);border:1px solid rgba(255,160,50,.4);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.84rem;font-weight:600;color:#e8913a;">⏸ Ladder is currently paused for a holiday break — matches will resume soon.</div>`
      : '';

    html += `
      <div class="round-section">
        <div class="round-header">
          <div class="round-title">Round ${round.roundNumber}</div>
          <div class="round-countdown" id="pubCountdown"></div>
        </div>
        ${pauseBanner}
        <div style="font-size:.8rem;color:var(--text-dim);margin-bottom:14px;">
          ${nonBye} matchup${nonBye !== 1 ? 's' : ''} · First to ${winsTarget} wins
        </div>
        <div class="pub-ld-grid" id="currentRoundGrid"></div>
      </div>`;

    section.innerHTML = html;

    const grid = document.getElementById('currentRoundGrid');
    pairings.forEach(p => grid.appendChild(buildPubLadderCard(p, winsTarget)));

    // Live countdown (only when active)
    const cdEl = document.getElementById('pubCountdown');
    if (status === 'paused') {
      const remMs = ko.pauseRemainingMs || 0;
      const d = Math.floor(remMs / 86400000);
      const h = Math.floor((remMs % 86400000) / 3600000);
      const m = Math.floor((remMs % 3600000) / 60000);
      cdEl.textContent = `⏸ ${d > 0 ? `${d}d ${h}h` : h > 0 ? `${h}h ${m}m` : `${m}m`} remaining`;
      cdEl.className = 'round-countdown';
    } else {
      const tick = () => {
        if (!cdEl) { clearInterval(countdownInterval); return; }
        const txt = formatCountdown(round.endTime);
        if (txt) {
          cdEl.textContent = txt;
          cdEl.className = 'round-countdown';
        } else {
          cdEl.textContent = 'Round ended';
          cdEl.className = 'round-countdown ended';
          clearInterval(countdownInterval);
        }
      };
      tick();
      countdownInterval = setInterval(tick, 30000);
    }

    html = ''; // history will be appended via DOM below
  } else {
    section.innerHTML = html;
    html = '';
  }

  // Completed rounds history
  const completedRounds = rounds.filter((r, i) =>
    r.status === 'completed' || (status === 'completed' && i <= currentRoundIdx)
  );

  if (completedRounds.length) {
    const histSection = document.createElement('div');
    histSection.className = 'ko-history-section';
    histSection.innerHTML = `<div class="ko-history-title">Completed Rounds</div>`;
    completedRounds.forEach(r => {
      const winners = (r.pairings || []).map(p => p.winner).filter(Boolean);
      const row = document.createElement('div');
      row.className = 'ko-history-row';
      row.innerHTML = `
        <span class="ko-round-badge">Round ${r.roundNumber}</span>
        ${winners.map(w => `<span class="pub-ld-winner-badge">🏆 ${w}</span>`).join('')}
        <span style="font-size:.68rem;color:var(--text-dim);margin-left:auto;">First to ${winsTarget} wins</span>`;
      histSection.appendChild(row);
    });
    section.appendChild(histSection);
  }
}

function buildCustomLadder(custom) {
  const section    = document.getElementById('customLadderSection');
  const status     = custom.status || 'idle';
  const winsTarget = custom.winsTarget || 10;

  if (status === 'idle' || !custom.pairings) {
    section.innerHTML = '';
    return;
  }

  const pauseBanner = status === 'paused'
    ? `<div style="background:rgba(255,160,50,.12);border:1px solid rgba(255,160,50,.4);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.84rem;font-weight:600;color:#e8913a;">⏸ Custom ladder is currently paused — matches will resume soon.</div>`
    : '';

  const pairings = custom.pairings || [];
  const nonBye   = pairings.filter(p => !p.bye).length;

  section.innerHTML = `
    <div class="round-section">
      <div class="round-header">
        <div class="round-title">🎯 ${custom.name || 'Custom Ladder'}</div>
        <div style="font-size:.8rem;color:var(--text-dim);">First to ${winsTarget} wins</div>
      </div>
      ${pauseBanner}
      <div style="font-size:.8rem;color:var(--text-dim);margin-bottom:14px;">${nonBye} matchup${nonBye !== 1 ? 's' : ''}</div>
      <div class="pub-ld-grid" id="customLadderGrid"></div>
    </div>`;

  const grid = document.getElementById('customLadderGrid');
  pairings.forEach(p => grid.appendChild(buildPubLadderCard(p, winsTarget)));
}
</script>
</body>
</html>

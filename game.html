<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♟️ Chess Game</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        
        .players {
            font-size: 1.1rem;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .board-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        #board {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .status {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .status h2 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        #turnStatus {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }
        
        .game-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .resign-btn {
            background: #f43f5e;
            color: white;
        }
        
        .resign-btn:hover {
            background: #e11d48;
            transform: translateY(-2px);
        }
        
        .draw-btn {
            background: #fbbf24;
            color: white;
        }
        
        .draw-btn:hover {
            background: #f59e0b;
            transform: translateY(-2px);
        }
        
        .back-btn {
            background: #667eea;
            color: white;
        }
        
        .back-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>♟️ Chess Game</h1>
        <div class="players" id="playersInfo">Loading...</div>
    </div>

    <div class="container">
        <div class="board-container">
            <div id="board"></div>
        </div>

        <div class="status">
            <h2>Game Status</h2>
            <div id="turnStatus">Loading...</div>
            <div class="game-actions">
                <button class="resign-btn" id="resignBtn">Resign</button>
                <button class="draw-btn" id="drawBtn">Offer Draw</button>
                <button class="back-btn" onclick="window.location.href='lobby.html'">Back to Lobby</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getDatabase, ref, onValue, update, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Firebase config - REPLACE WITH YOUR OWN
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // Get game ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');
        
        if (!gameId) {
            window.location.href = 'lobby.html';
        }

        let currentUser = null;
        let game = new Chess();
        let board = null;
        let gameData = null;
        let myColor = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            
            currentUser = user;
            loadGame();
        });

        function loadGame() {
            const gameRef = ref(database, 'games/' + gameId);
            onValue(gameRef, (snapshot) => {
                gameData = snapshot.val();
                
                if (!gameData) {
                    alert('Game not found!');
                    window.location.href = 'lobby.html';
                    return;
                }
                
                // Determine my color
                if (gameData.white === currentUser.uid) {
                    myColor = 'white';
                } else if (gameData.black === currentUser.uid) {
                    myColor = 'black';
                } else {
                    myColor = 'spectator';
                }
                
                // Update UI
                document.getElementById('playersInfo').innerHTML = 
                    `<span style="color: #f8f9fa">⚪ ${gameData.whiteName}</span> vs <span style="color: #1f2937">⚫ ${gameData.blackName}</span>`;
                
                // Load position
                game.load(gameData.fen);
                
                if (board === null) {
                    initBoard();
                } else {
                    board.position(gameData.fen);
                }
                
                updateStatus();
            });
        }

        function initBoard() {
            const config = {
                draggable: true,
                position: gameData.fen,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
                orientation: myColor
            };
            
            board = Chessboard('board', config);
            window.addEventListener('resize', board.resize);
        }

        function onDragStart(source, piece, position, orientation) {
            // Don't allow moves if game is over
            if (game.game_over()) return false;
            
            // Don't allow moves if it's not your turn
            if (gameData.turn !== myColor.charAt(0)) return false;
            
            // Don't allow moving opponent's pieces
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop(source, target) {
            // See if the move is legal
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Always promote to queen for simplicity
            });
            
            // Illegal move
            if (move === null) return 'snapback';
            
            // Update Firebase
            updateGameState();
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        async function updateGameState() {
            const gameRef = ref(database, 'games/' + gameId);
            
            let status = 'active';
            let winner = null;
            
            if (game.in_checkmate()) {
                status = 'finished';
                winner = game.turn() === 'w' ? gameData.black : gameData.white;
            } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
                status = 'draw';
            }
            
            await update(gameRef, {
                fen: game.fen(),
                turn: game.turn(),
                status: status,
                winner: winner
            });
            
            if (status === 'finished' || status === 'draw') {
                await updatePlayerStats(status, winner);
            }
        }

        async function updatePlayerStats(status, winner) {
            if (status === 'draw') {
                // Increment draws for both players
                const whiteRef = ref(database, 'users/' + gameData.white);
                const blackRef = ref(database, 'users/' + gameData.black);
                
                const whiteSnap = await get(whiteRef);
                const blackSnap = await get(blackRef);
                
                await update(whiteRef, { draws: (whiteSnap.val().draws || 0) + 1 });
                await update(blackRef, { draws: (blackSnap.val().draws || 0) + 1 });
            } else if (status === 'finished') {
                // Update wins/losses
                const winnerRef = ref(database, 'users/' + winner);
                const loserId = winner === gameData.white ? gameData.black : gameData.white;
                const loserRef = ref(database, 'users/' + loserId);
                
                const winnerSnap = await get(winnerRef);
                const loserSnap = await get(loserRef);
                
                await update(winnerRef, { wins: (winnerSnap.val().wins || 0) + 1 });
                await update(loserRef, { losses: (loserSnap.val().losses || 0) + 1 });
            }
        }

        function updateStatus() {
            let status = '';
            
            if (game.in_checkmate()) {
                status = '🏆 Checkmate! ' + (game.turn() === 'w' ? gameData.blackName : gameData.whiteName) + ' wins!';
            } else if (game.in_draw()) {
                status = '🤝 Draw by insufficient material';
            } else if (game.in_stalemate()) {
                status = '🤝 Stalemate - Draw!';
            } else if (game.in_threefold_repetition()) {
                status = '🤝 Draw by threefold repetition';
            } else if (game.in_check()) {
                status = '⚠️ Check! ' + (game.turn() === 'w' ? gameData.whiteName : gameData.blackName) + '\'s turn';
            } else {
                const turnName = game.turn() === 'w' ? gameData.whiteName : gameData.blackName;
                const isMyTurn = gameData.turn === myColor.charAt(0);
                status = (isMyTurn ? '✨ Your turn!' : `⏳ ${turnName}'s turn`);
            }
            
            document.getElementById('turnStatus').textContent = status;
        }

        // Resign button
        document.getElementById('resignBtn').addEventListener('click', async () => {
            if (confirm('Are you sure you want to resign?')) {
                const winner = myColor === 'white' ? gameData.black : gameData.white;
                await update(ref(database, 'games/' + gameId), {
                    status: 'finished',
                    winner: winner
                });
                await updatePlayerStats('finished', winner);
                alert('You resigned. Game over.');
            }
        });

        // Draw button
        document.getElementById('drawBtn').addEventListener('click', async () => {
            if (confirm('Offer a draw? (This would require opponent acceptance in a full version)')) {
                await update(ref(database, 'games/' + gameId), {
                    status: 'draw'
                });
                await updatePlayerStats('draw', null);
                alert('Draw agreed!');
            }
        });
    </script>
</body>
</html>
